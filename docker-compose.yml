services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: honeypot-clickhouse
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    volumes:
      - ./data/clickhouse:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  suricata:
    image: jasonish/suricata:latest
    container_name: honeypot-suricata
    restart: unless-stopped
    network_mode: "host"
    security_opt:
      - no-new-privileges:true
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_NICE
    volumes:
      - ./data/suricata-logs:/var/log/suricata
    command: -i any
